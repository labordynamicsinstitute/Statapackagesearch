name: Test CI Stata

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Monthly, on the 1st at 06:17 UTC, to catch drift (SSC, Stata image, license)
    - cron: '17 6 1 * *'

env:
  STATA_IMAGE: dataeditors/stata19_5-mp:2026-08-12

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Stata license
      env:
        STATA_LIC_BASE64: ${{ secrets.STATA_LIC_BASE64 }}
      run: |
        if [[ -z "$STATA_LIC_BASE64" ]]
        then
          echo "::error::STATA_LIC_BASE64 secret is not available to this repository"
          exit 1
        fi
        echo "$STATA_LIC_BASE64" | base64 -d > stata.lic
    - name: Prepare
      # the container runs as statauser, which must be able to write logs and outputs
      run: chmod -R a+rwX .
    - name: Run Stata tests
      run: |
        docker run --rm \
          -v "$(pwd)/stata.lic:/usr/local/stata/stata.lic" \
          -v "$(pwd):/project" \
          -w /project \
          --entrypoint /bin/bash \
          "$STATA_IMAGE" \
          ./test/run.sh
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: stata-logs
        path: |
          *.log
          actual_output*.txt
