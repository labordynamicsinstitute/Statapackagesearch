on:
  push:
    branches: [main, master]
  pull_request:

name: Build Site

jobs:
  adodownr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.0.37

      - name: Install dependencies
        run: |
          sudo apt-get install -y make libcurl4-openssl-dev libssl-dev libfontconfig1-dev libfreetype6-dev libfribidi-dev libharfbuzz-dev libjpeg-dev libpng-dev libtiff-dev libicu-dev pandoc libxml2-dev libgit2-dev libssh2-1-dev zlib1g-dev git
          pip install jupyter

      - name: Install pak
        run: install.packages("pak")
        shell: Rscript {0}

      - name: Install adodownr
        run: pak::pak("lsms-worldbank/adodownr")
        shell: Rscript {0}

      - name: Install here
        run: install.packages("here")
        shell: Rscript {0}

      - name: Copy files per adodown_assets.yml mapping
        run: |
          config <- yaml::read_yaml("src/dev/adodown_assets.yml")
          for (item in config$copy) {
            dest_dir <- dirname(item$to)
            if (!dir.exists(dest_dir)) dir.create(dest_dir, recursive = TRUE)
            file.copy(item$from, item$to, overwrite = TRUE)
            cat(sprintf("Copied %s -> %s\n", item$from, item$to))
          }
        shell: Rscript {0}

      - name: Extract Testing vignette from README
        run: |
          readme <- readLines("README.md", warn = FALSE)
          testing_start <- grep("^## Testing", readme)
          if (length(testing_start) > 0) {
            next_h2 <- grep("^## ", readme)
            next_h2 <- next_h2[next_h2 > testing_start[1]]
            testing_end <- if (length(next_h2) > 0) next_h2[1] - 1 else length(readme)
            testing_content <- readme[testing_start[1]:testing_end]
            dir.create("src/vignettes", recursive = TRUE, showWarnings = FALSE)
            yaml_header <- c("---", "execute:", "  eval: false", "---", "")
            writeLines(c(yaml_header, testing_content), "src/vignettes/testing.qmd")
            cat("Created src/vignettes/testing.qmd\n")
          }
        shell: Rscript {0}

      - name: Build site
        run: adodownr::build_site(pkg_dir = here::here(), site_dir = here::here())
        shell: Rscript {0}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: adodownr
    steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
